version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # ESLint 10 несовместим с eslint-config-next: eslint-plugin-react,
      # eslint-plugin-import и eslint-plugin-jsx-a11y (последние версии) не
      # поддерживают ESLint 10. Разблокировать после релиза eslint-config-next
      # с поддержкой ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 (нативный порт) не поддерживается typescript-eslint:
      # даже canary (8.66.1-alpha.4) объявляет peer typescript ">=4.8.4 <6.1.0"
      # и падает на старте линтинга с "typescript-eslint does not support TS 7.0".
      # eslint-config-next тянет typescript-eslint транзитивно, поэтому обойти
      # это на стороне проекта нельзя. Разблокировать после закрытия
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
